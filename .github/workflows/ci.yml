name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest test suite (124 tests)
        working-directory: backend
        run: |
          pytest tests -v --durations=10

  workspace-typecheck:
    name: Monorepo Type Safety (Root, Shared, AGEN, Hotel)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Verify Root TypeScript compilation
        run: npm run typecheck

      - name: Verify Shared Package compilation
        run: npx tsc --project packages/shared/tsconfig.json --noEmit

      - name: Install & Verify AGEN Portal TypeScript compilation
        run: |
          cd AGEN
          npm ci || npm install
          npm run type-check

      - name: Install & Verify Hotel UI TypeScript compilation
        run: |
          cd hotel
          npm ci || npm install
          npm run typecheck

  code-lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

  frontend-unit-tests:
    name: Frontend Jest Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Jest test suite
        run: npm test -- --passWithNoTests --ci --maxWorkers=2

  security-scan:
    name: Secret Scanning & Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Node.js for Audit
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependency Audit (Critical Level)
        run: npm audit --audit-level=critical || true

  bundle-check:
    name: Expo Web Bundle Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify Web Bundle Export
        run: npx expo export -p web --no-minify
        env:
          EXPO_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
