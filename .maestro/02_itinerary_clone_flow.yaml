# Maestro E2E Flow: 02_itinerary_clone_flow.yaml
# Tests Exploring Marketplace Trips, Day Overview, 1-Click Clone & Budget Optimization
appId: com.shopnojatra.app
---
- launchApp

# Navigate to Trips Tab
- tapOn: "Trips|ভ্রমণ|Explore Trips"

# Verify Itinerary Cards are listed
- assertVisible: "Explore Trips|Community Itineraries"

# Tap on a featured itinerary (e.g. Sajek or Cox's Bazar)
- tapOn:
    text: "Sajek Valley|Cox's Bazar|Sylhet"
    index: 0

# Verify Itinerary Details Screen & Timeline
- assertVisible: "Day 1|Overview|Timeline"

# Tap 1-Click Clone
- tapOn: "1-Click Clone|Clone & Customize|কপি করুন"

# Verify Customization Studio opens
- assertVisible: "Customization Studio|Travel Date|Budget"

# Tap Optimize Budget with AI
- tapOn:
    text: "AI Optimize Budget|Optimize"
    optional: true

# Proceed to Checkout
- tapOn: "Proceed to Checkout|চালিয়ে যান"
- assertVisible: "Trip Checkout|Payment"
