worker_processes 2;
worker_rlimit_nofile 131072;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include mime.types;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Rate limiting zones per IP
    limit_req_zone $binary_remote_addr zone=api_route:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=ws_connect:10m rate=60r/s;

    upstream spatial_bff {
        server spatial-bff:8080;
        keepalive 64;
    }
    upstream centrifugo_ws {
        server centrifugo:8000;
        keepalive 64;
    }
    upstream martin_tiles {
        server martin:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.yourdomain.com ws.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.yourdomain.com ws.yourdomain.com;

        # Self-signed fallback or Let's Encrypt live path
        ssl_certificate /etc/letsencrypt/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;

        # 1. Unified Google-Compatible Spatial APIs (Shielded via Go Spatial BFF)
        location /v1/ {
            limit_req zone=api_route burst=40 nodelay;
            proxy_pass http://spatial_bff;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. High-Concurrency WebSockets (DNS-only / Grey Cloud bypasses CF timeouts)
        location /connection/websocket {
            limit_req zone=ws_connect burst=100 nodelay;
            proxy_pass http://centrifugo_ws/connection/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 3. Standby Vector Tiles / Fonts (Primary tile traffic uses Cloudflare R2 directly)
        location /tiles/ {
            proxy_pass http://martin_tiles/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # Health Check
        location /healthz {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
